name: bukify
description: "BukiFy - Local Service Provider App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ✅ ASSETS (REQUIRED FOR YOUR APP)
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/logo_2.png


